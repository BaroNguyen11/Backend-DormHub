spring:
  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: DEBUG


dormhub:
  jwt:
    secret: ${DORMHUB_JWT_SECRET}
    access-token-minutes: 15
    cookie-secure: ${DORMHUB_COOKIE_SECURE:true}

  sepay:
    api-key: ${DORMHUB_SEPAY_API_KEY:}
    webhook-secret: ${DORMHUB_SEPAY_WEBHOOK_SECRET:}
    sync-min-interval-seconds: 10
    transactions:
      enabled: true
      url: https://my.sepay.vn/userapi/transactions/list
      account-number: ${DORMHUB_SEPAY_ACCOUNT_NUMBER:}
      limit: 30
      timeout-seconds: 5

  payment:
    test-bank-code: ${DORMHUB_PAYMENT_TEST_BANK_CODE:ACB}
    test-account-number: ${DORMHUB_PAYMENT_TEST_ACCOUNT_NUMBER:}
    reference-prefix: ${DORMHUB_PAYMENT_REFERENCE_PREFIX:DH}
    reference-suffix-length: ${DORMHUB_PAYMENT_REFERENCE_SUFFIX_LENGTH:12}
    reference-character-type: ${DORMHUB_PAYMENT_REFERENCE_CHARACTER_TYPE:ALPHANUMERIC}
    ttl-minutes: ${DORMHUB_PAYMENT_TTL_MINUTES:15}
    qr-template: ${DORMHUB_PAYMENT_QR_TEMPLATE:compact}