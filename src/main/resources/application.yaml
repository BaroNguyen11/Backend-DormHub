spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: qwen3-embedding:0.6b
    vectorstore:
      pgvector:
        schema-name: public
        initialize-schema: false
        remove-existing-vector-store-table: false
        table-name: dormhub_room_vectors
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: NONE

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.hibernate.SQL: DEBUG

dormhub:
  payment:
    test-bank-code: ${DORMHUB_PAYMENT_TEST_BANK_CODE:}
    test-account-number: ${DORMHUB_PAYMENT_TEST_ACCOUNT_NUMBER:}
    reference-prefix: ${DORMHUB_PAYMENT_REFERENCE_PREFIX:DH}
    reference-suffix-length: ${DORMHUB_PAYMENT_REFERENCE_SUFFIX_LENGTH:12}
    reference-character-type: ${DORMHUB_PAYMENT_REFERENCE_CHARACTER_TYPE:ALPHANUMERIC}
    ttl-minutes: ${DORMHUB_PAYMENT_TTL_MINUTES:15}
    qr-template: ${DORMHUB_PAYMENT_QR_TEMPLATE:compact}
  sepay:
    webhook-secret: ${DORMHUB_SEPAY_WEBHOOK_SECRET:}
  jwt:
    secret: ${DORMHUB_JWT_SECRET}
    access-token-minutes: 15
    cookie-secure: ${DORMHUB_COOKIE_SECURE:false}
