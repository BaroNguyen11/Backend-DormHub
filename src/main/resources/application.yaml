spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dorm_hub
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.hibernate.SQL: DEBUG
dormhub:
  jwt:
    secret: ${DORMHUB_JWT_SECRET}
    access-token-minutes: 15
    cookie-secure: ${DORMHUB_COOKIE_SECURE:false}