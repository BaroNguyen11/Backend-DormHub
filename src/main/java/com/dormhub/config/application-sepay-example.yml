# =====================================================================
# VÍ DỮ CẤU HÌNH SEPAY CHO DORMHUB — sao chép các key dưới đây vào
# application.yml (hoặc application.properties tương ứng) của bạn.
# KHÔNG copy nguyên file này đè lên cấu hình chính!
# =====================================================================
#
# Chuỗi hoạt động hoàn chỉnh:
#   SV bấm "Thanh toán" -> QR VietQR (mã tham chiếu DH...) -> chuyển khoản
#   -> SePay bắn webhook về POST /api/v1/payments/webhooks/sepay
#      (header: Authorization: Apikey <SEPAY_API_KEY>)
#   -> backend đối soát: mã DH... + số tiền == tổng hóa đơn + đúng tài khoản nhận
#   -> payments: PENDING -> SUCCESS
#      (hóa đơn cọc: invoice PAID + hợp đồng ACTIVE + TỰ ĐỘNG PHÂN PHÒNG)
#   -> FE trang kết quả thanh toán tự poll 5s -> tự xanh -> tự vào "Phòng của tôi"
#
# Phòng khi webhook lỡ: đăng nhập/bấm "Kiểm tra lại" sẽ kéo giao dịch từ
# SePay Transactions API về và đối soát bù theo cùng nghiệp vụ.

dormhub:
  sepay:
    # BẮT BUỘC: lấy trong my.sepay.vn -> Cài đặt -> API.
    # SePay gửi đúng giá trị này trong header Authorization của webhook.
    # Chưa điền -> backend chạy chế độ dev (chấp nhận mọi webhook, có cảnh báo).
    api-key: "DIEP_API_KEY_CUA_BAN_TREN_MY_SEPAY_VN"

    # (Tuỳ chọn) chỉ dùng khi tự bắn webhook có chữ ký HMAC bằng script simulate.
    webhook-secret: ""

    # Chống gọi SePay API quá dày (giây) giữa 2 lượt đối soát của cùng user.
    sync-min-interval-seconds: 10

    transactions:
      # Đối soát chủ động khi đăng nhập / bấm "Kiểm tra lại".
      enabled: true
      url: https://my.sepay.vn/userapi/transactions/list
      # Số tài khoản đăng ký nhận tiền với SePay (lọc giao dịch vào đúng TK).
      # Ví dụ ACB: "123456789"; để rỗng nếu muốn kéo tất cả tài khoản.
      account-number: "SO_TAI_KHOAN_NHAN_TIEN"
      limit: 30
      timeout-seconds: 5

  payment:
    # Ngân hàng nhận tiền — hiện hỗ trợ ACB hoặc MB (Phòng/Kỳ Quỹ VietQR).
    test-bank-code: ACB
    test-account-number: "SO_TAI_KHOAN_NHAN_TIEN"
    # Mã tham chiếu: DH + 12 ký tự (giữ nguyên để webhook khớp được).
    reference-prefix: DH
    reference-suffix-length: 12
    reference-character-type: ALPHANUMERIC
    ttl-minutes: 15
